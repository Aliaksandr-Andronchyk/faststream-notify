[project]
name = "faststream-notify"
version = "0.1.0"
description = "Notification microservice for a lesson-booking platform — FastStream + RabbitMQ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faststream[rabbit]>=0.5",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
